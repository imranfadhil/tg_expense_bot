name: tg_expense_bot

services:
  db:
    image: postgres:16-alpine
    container_name: tg_expense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-family_expenses}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense_user} -d ${POSTGRES_DB:-family_expenses}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: tg_expense_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-8090}:${WEBAPP_PORT:-8090}"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tg_expense_tunnel
    restart: unless-stopped
    depends_on:
      - bot
    command: tunnel --no-autoupdate --url http://bot:${WEBAPP_PORT:-8090} --metrics 0.0.0.0:2000

volumes:
  postgres_data:

